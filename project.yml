name: MyAttendance
options:
  bundleIdPrefix: com.myattendance
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: H89G83B646
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MyAttendance:
    type: application
    platform: iOS
    sources:
      - MyAttendance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myattendance.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_CFBundleDisplayName: MyAttendance
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - MyAttendanceTests
  MyAttendanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MyAttendanceTests
    dependencies:
      - target: MyAttendance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.myattendance.app.tests
